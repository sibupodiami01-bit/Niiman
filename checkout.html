<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Niiman Checkout</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🛒 Niiman Checkout</h1>

<div class="checkout-box">

<h2>Customer Details</h2>

<input type="text" id="customerName" placeholder="Your Name">

<input type="tel" id="customerPhone" placeholder="Mobile Number">

<textarea id="customerAddress" placeholder="Full Address"></textarea>

<h2>Order Summary</h2>

<div id="checkoutItems"></div>
<div class="coupon-box">
    <input type="text" id="couponCode" placeholder="Enter Coupon Code">
    <button id="applyCoupon">Apply</button>
    <p id="couponMessage"></p>
</div>
<p id="subtotal">Subtotal: ₹0</p>
<p id="discountAmount">Discount: ₹0</p>
<p id="deliveryCharge">Delivery Charge: ₹0</p>
<h3>Total: ₹<span id="checkoutTotal">0</span></h3>

<button id="placeOrder">
    ✅ Place Order
</button>

</div>

<script type="module" src="checkout.js"></script>

</body>

</html>

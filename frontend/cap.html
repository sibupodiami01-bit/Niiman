<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Niiman Product</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Niiman Product Details</h1>

<div class="product-details">

<img src="cap.jpg" alt="Niiman cap" class="product-image">

    <h2>Niiman cap</h2>

    <p class="rating">⭐⭐⭐⭐☆ (4.5)</p>

    <p class="price">699</p>
<div class="quantity-box">

    <button id="minusBtn">-</button>

    <span id="quantity">1</span>

    <button id="plusBtn">+</button>

</div>

<h3>Size</h3>

<div class="size-options">

    <button class="sizeBtn active" data-size="M">M</button>

    <button class="sizeBtn" data-size="L">L</button>

    <button class="sizeBtn" data-size="XL">XL</button>

    <button class="sizeBtn" data-size="XXL">XXL</button>

</div>

    <p>
        Premium quality Niiman cap.
        Comfortable and stylish design.
    </p>

    <button id="productAddCart"
data-name="Niiman cap"
data-price="1999"
data-size="M">
🛒 Add to Cart
</button>

<button id="productWishlist"
data-name="Niiman ">
    ❤️ Wishlist
</button>
<a href="index.html">
    <button>
        ⬅️ Back to Products
    </button>
</a>
<div id="cartData" style="display:none;">

    <span id="cartCount">0</span>

    <div id="cartItems"></div>

    <span id="cartTotal">0</span>

</div>

<div id="toast" class="toast"></div>
</div>
<script src="product.js"></script>
</body>
</html>
